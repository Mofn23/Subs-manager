name: Build iOS IPA for SideStore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    permissions:
      contents: write
    env:
      POSTGRES_PRISMA_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy?sslmode=disable"
      POSTGRES_URL_NON_POOLING: "postgresql://postgres:postgres@localhost:5432/dummy?sslmode=disable"
      NEXTAUTH_SECRET: "dummy_secret_key_1234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Build Offline Bundle
        run: |
          npx prisma generate
          npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build Xcode Archive (.xcarchive)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              archive -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              archive -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package Payload into SubsManager.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "Found compiled App bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build directory!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r SubsManager.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsManager.ipa
          path: build/SubsManager.ipa
          retention-days: 30

      - name: Create or Update GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.4-offline-ipa
          name: Subs Manager 100% Standalone Offline Native iOS IPA (v2.0.4)
          body: |
            ## 📱 Subs Manager 100% Standalone Offline Native iOS IPA Package
            
            This `.ipa` file is compiled for offline execution on iOS devices.
            
            ### ✨ Features:
            - **100% Offline & Independent**: No Vercel servers, 0ms latency, works in Airplane Mode.
            - **Local iPhone Data Sovereignty**: All subscriptions stored locally on your iPhone.
            - **Native iOS Notifications**: Sound & alerts for 3 days, 1 day, and same-day renewals.
            - **Dynamic Island Safe Area**: Perfectly fitted top navbar layout.
            
            ### 📥 Installation via SideStore / AltStore:
            1. Download `SubsManager.ipa` on your iPhone.
            2. Open **SideStore** or **AltStore**.
            3. Tap the **+** (Add) button and select `SubsManager.ipa`.
            4. Enjoy Subs Manager running 100% natively & offline!
          files: build/SubsManager.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
