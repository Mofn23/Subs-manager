name: Build iOS IPA for SideStore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    permissions:
      contents: write
    env:
      POSTGRES_PRISMA_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy?sslmode=disable"
      POSTGRES_URL_NON_POOLING: "postgresql://postgres:postgres@localhost:5432/dummy?sslmode=disable"
      NEXTAUTH_SECRET: "dummy_secret_key_1234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare Native Web Container
        run: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <title>Subs Manager</title>
            <style>
              * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
              html, body {
                margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
                background-color: #0C0C0E; color: #FFFFFF; display: flex; flex-direction: column;
                align-items: center; justify-content: center; font-family: -apple-system, sans-serif;
              }
              .loader {
                width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1);
                border-top-color: #3B82F6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="loader"></div>
            <div style="font-size: 13px; font-weight: 500; opacity: 0.8;">Subs Manager...</div>
            <script>
              window.location.replace("https://subs-manager-mofn23s-projects.vercel.app");
            </script>
          </body>
          </html>
          EOF

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build Xcode Archive (.xcarchive)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              archive -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              archive -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package Payload into SubsManager.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "Found compiled App bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build directory!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r SubsManager.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubsManager.ipa
          path: build/SubsManager.ipa
          retention-days: 30

      - name: Create or Update GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0-ipa
          name: Subs Manager iOS Native IPA (v1.2.0)
          body: |
            ## 📱 Subs Manager iOS Native IPA Package for SideStore / AltStore
            
            This `.ipa` file is compiled automatically for iOS devices.
            
            ### 📥 Installation via SideStore / AltStore:
            1. Download `SubsManager.ipa` on your iPhone.
            2. Open **SideStore** or **AltStore**.
            3. Tap the **+** (Add) button and select `SubsManager.ipa`.
            4. Enjoy Subs Manager running natively on your iOS device!
          files: build/SubsManager.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
